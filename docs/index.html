    <script>
      // Self-healing bootstrap:
      // If GitHub Pages is serving root '/' directly from the main branch instead of 'dist/' or 'docs/',
      // dynamically load the pre-compiled production bundle so the page NEVER remains blank.
      (function() {
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (!isLocal && !window.__VITE_APP_MOUNTED__) {
          var basePath = '/youtube-shorts-auto-creator/';
          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = basePath + 'assets/index.css';
          document.head.appendChild(css);

          var js = document.createElement('script');
          js.type = 'module';
          js.crossOrigin = 'anonymous';
          js.src = basePath + 'assets/index.js';
          document.head.appendChild(js);
        }
      })();
    </script>
    <script type="module" crossorigin src="/youtube-shorts-auto-creator/assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="/youtube-shorts-auto-creator/assets/index.css">
